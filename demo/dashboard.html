<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Veritas — Enterprise Knowledge Graph & Graph RAG</title>
<!-- vis-network for physics-based interactive graph visualization -->
<script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel2: #1c2230; --border: #2d3444;
    --text: #e6edf3; --muted: #8b949e; --accent: #4C9AFF; --accent2: #36B37E;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; overflow: hidden;
  }
  header {
    padding: 14px 22px; background: linear-gradient(90deg, #10151f, #161b22);
    border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 16px;
  }
  header h1 { font-size: 18px; margin: 0; letter-spacing: .3px; }
  header .tag { font-size: 11px; color: var(--muted); background: var(--panel2);
    padding: 3px 9px; border-radius: 20px; border: 1px solid var(--border); }
  header .spacer { flex: 1; }
  .stats { display: flex; gap: 18px; }
  .stat { text-align: center; }
  .stat .num { font-size: 20px; font-weight: 700; color: var(--accent); line-height: 1; }
  .stat .lbl { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }

  .tabs { display: flex; gap: 4px; padding: 8px 22px 0; background: var(--panel);
    border-bottom: 1px solid var(--border); }
  .tab { padding: 9px 18px; cursor: pointer; color: var(--muted); font-size: 13px;
    border: 1px solid transparent; border-bottom: none; border-radius: 8px 8px 0 0; }
  .tab.active { background: var(--bg); color: var(--text); border-color: var(--border); }

  main { height: calc(100vh - 118px); position: relative; }
  .view { display: none; height: 100%; }
  .view.active { display: flex; }

  /* --- Graph view --- */
  #graph { flex: 1; height: 100%; background:
    radial-gradient(circle at 30% 20%, #131a26 0%, #0d1117 70%); }
  .sidebar { width: 300px; border-left: 1px solid var(--border); background: var(--panel);
    padding: 16px; overflow-y: auto; }
  .sidebar h3 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase;
    letter-spacing: .6px; color: var(--muted); }
  .legend-item { display: flex; align-items: center; gap: 9px; margin-bottom: 7px; font-size: 13px; }
  .swatch { width: 14px; height: 14px; border-radius: 3px; flex: none; }
  .detail { margin-top: 20px; padding: 14px; background: var(--panel2);
    border: 1px solid var(--border); border-radius: 8px; font-size: 13px; min-height: 60px; }
  .detail .name { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
  .detail .lab { display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 12px;
    color: #0d1117; font-weight: 700; margin-bottom: 8px; }
  .detail .row { color: var(--muted); margin: 3px 0; }
  .detail .row b { color: var(--text); font-weight: 600; }
  .controls { margin-top: 18px; display: flex; flex-direction: column; gap: 8px; }
  .controls button { background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    padding: 8px; border-radius: 6px; cursor: pointer; font-size: 12px; }
  .controls button:hover { border-color: var(--accent); }

  /* --- Documents view --- */
  #docsView { padding: 22px; overflow-y: auto; width: 100%; gap: 18px; flex-wrap: wrap; align-content: flex-start; }
  .doc-card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px; width: calc(33% - 12px); min-width: 300px; }
  .doc-card .dt { font-size: 10px; text-transform: uppercase; letter-spacing: .5px;
    color: #0d1117; background: var(--accent2); padding: 2px 8px; border-radius: 10px; font-weight: 700; }
  .doc-card h4 { margin: 10px 0 4px; font-size: 14px; }
  .doc-card .src { font-size: 11px; color: var(--muted); margin-bottom: 10px; word-break: break-all; }
  .doc-card pre { white-space: pre-wrap; font-size: 11.5px; color: #c9d1d9; max-height: 260px;
    overflow-y: auto; background: var(--bg); padding: 10px; border-radius: 6px; margin: 0;
    border: 1px solid var(--border); font-family: "SF Mono", Menlo, monospace; }

  /* --- RAG view --- */
  #ragView { flex-direction: column; padding: 22px; width: 100%; overflow-y: auto; }
  .rag-box { max-width: 900px; margin: 0 auto; width: 100%; }
  .rag-input { display: flex; gap: 10px; margin-bottom: 8px; }
  .rag-input input { flex: 1; padding: 12px 14px; background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; font-size: 14px; }
  .rag-input button { padding: 12px 22px; background: var(--accent); color: #0d1117;
    border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }
  .samples { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .samples .chip { font-size: 12px; padding: 6px 12px; background: var(--panel2);
    border: 1px solid var(--border); border-radius: 20px; cursor: pointer; color: var(--muted); }
  .samples .chip:hover { color: var(--text); border-color: var(--accent); }
  .rag-result { display: none; }
  .rag-result.show { display: block; }
  .rag-section { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px; margin-bottom: 14px; }
  .rag-section h3 { margin: 0 0 12px; font-size: 12px; text-transform: uppercase;
    letter-spacing: .6px; color: var(--muted); }
  .chunk { background: var(--bg); border: 1px solid var(--border); border-left: 3px solid var(--accent2);
    padding: 10px 12px; border-radius: 6px; margin-bottom: 8px; font-size: 12.5px; }
  .chunk .meta { font-size: 10.5px; color: var(--muted); margin-bottom: 4px; }
  .chunk .score { color: var(--accent2); font-weight: 700; }
  .triple { font-size: 13px; padding: 7px 0; border-bottom: 1px dashed var(--border); }
  .triple .h { color: var(--accent); font-weight: 600; }
  .triple .r { color: var(--muted); font-size: 11px; padding: 1px 6px; background: var(--panel2);
    border-radius: 4px; margin: 0 6px; }
  .triple .t { color: var(--accent2); font-weight: 600; }
  .empty { color: var(--muted); font-size: 13px; }
  pre.json { background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 14px; font-size: 11.5px; color: #c9d1d9; overflow-x: auto;
    font-family: "SF Mono", Menlo, monospace; }
  #banner { display:none; background:#3a1d1d; color:#ffb4a2; padding:10px 22px; font-size:13px;
    border-bottom:1px solid #5a2a2a; }
  #banner a { color:#ffd6cc; }
</style>
</head>
<body>
<div id="banner"></div>
<header>
  <h1>🔎 Veritas</h1>
  <span class="tag">Enterprise Knowledge Graph &amp; Graph RAG · Phase 1</span>
  <div class="spacer"></div>
  <div class="stats" id="statsBar"></div>
</header>

<div class="tabs">
  <div class="tab active" data-view="graphView">Knowledge Graph</div>
  <div class="tab" data-view="ragView">Graph RAG Query</div>
  <div class="tab" data-view="docsView">Source Documents</div>
</div>

<main>
  <!-- GRAPH VIEW -->
  <section class="view active" id="graphView">
    <div id="graph"></div>
    <aside class="sidebar">
      <h3>Legend</h3>
      <div id="legend"></div>
      <h3 style="margin-top:22px">Selection</h3>
      <div class="detail" id="detail"><span class="empty">Click a node to inspect it.</span></div>
      <div class="controls">
        <button id="btnPhysics">Toggle physics</button>
        <button id="btnFit">Fit to screen</button>
        <button id="btnMentions">Toggle document links</button>
      </div>
    </aside>
  </section>

  <!-- RAG VIEW -->
  <section class="view" id="ragView">
    <div class="rag-box">
      <div class="rag-input">
        <input id="ragQuery" placeholder="Ask a question about the enterprise knowledge base..." />
        <button id="ragBtn">Retrieve</button>
      </div>
      <div class="samples" id="samples"></div>
      <div class="rag-result" id="ragResult">
        <div class="rag-section">
          <h3>1 · Vector entry-point chunks (semantic search)</h3>
          <div id="ragChunks"></div>
        </div>
        <div class="rag-section">
          <h3>2 · Retrieved subgraph (1–2 hop expansion)</h3>
          <div id="ragTriples"></div>
        </div>
        <div class="rag-section">
          <h3>3 · Payload handed to the RAG generator (JSON)</h3>
          <pre class="json" id="ragJson"></pre>
        </div>
      </div>
    </div>
  </section>

  <!-- DOCS VIEW -->
  <section class="view" id="docsView"></section>
</main>

<script>
// ===========================================================================
// Veritas dashboard — loads demo/graph_export.json and renders three views.
// All logic runs client-side; the "Graph RAG" tab performs a lightweight
// keyword-weighted retrieval + neighbourhood expansion over the exported graph
// to mirror what veritas/retrieval.py returns from Neo4j.
// ===========================================================================
let DATA = null, network = null, physicsOn = true, mentionsVisible = true;

const STOPWORDS = new Set(("a an the is are was were of to in on for and or with what who "
  + "which how does do use uses using expert experts about affect affects block blocks").split(" "));

async function boot() {
  try {
    const res = await fetch("graph_export.json", { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    DATA = await res.json();
  } catch (e) {
    showBanner("Could not load <b>graph_export.json</b>. Run <code>python3 demo/build_graph_export.py</code> "
      + "and serve this folder (e.g. <code>python3 demo/serve_dashboard.py</code>). Error: " + e.message);
    return;
  }
  renderStats(); renderLegend(); renderGraph(); renderDocs(); renderSamples();
}

function showBanner(html) { const b = document.getElementById("banner"); b.innerHTML = html; b.style.display = "block"; }

function renderStats() {
  const s = DATA.stats;
  const items = [["Documents", s.documents], ["Entities", s.entities],
    ["Relationships", s.relationships], ["Chunks", s.chunks]];
  document.getElementById("statsBar").innerHTML = items.map(([l, n]) =>
    `<div class="stat"><div class="num">${n}</div><div class="lbl">${l}</div></div>`).join("");
}

function renderLegend() {
  document.getElementById("legend").innerHTML = Object.entries(DATA.legend).map(([label, st]) =>
    `<div class="legend-item"><span class="swatch" style="background:${st.color}"></span>${label}</div>`).join("");
}

// ---- Graph view -----------------------------------------------------------
function buildVisData() {
  const nodes = DATA.nodes.map(n => ({
    id: n.id, label: n.name, color: { background: n.color, border: "#0d1117" },
    shape: n.shape === "database" ? "box" : n.shape, font: { color: "#e6edf3", size: 14 },
    _type: n.label, size: n.label === "Document" ? 14 : 20,
  }));
  const edges = DATA.edges
    .filter(e => mentionsVisible || e.relationship !== "MENTIONS")
    .map(e => ({
      from: e.source, to: e.target, label: e.relationship,
      arrows: "to", font: { color: "#8b949e", size: 10, strokeWidth: 0 },
      color: { color: e.relationship === "MENTIONS" ? "#3a4150" : "#5a6478" },
      dashes: e.relationship === "MENTIONS",
    }));
  return { nodes, edges };
}

function renderGraph() {
  const { nodes, edges } = buildVisData();
  const container = document.getElementById("graph");
  const options = {
    physics: { enabled: true, barnesHut: { gravitationalConstant: -8000, springLength: 130 } },
    interaction: { hover: true, tooltipDelay: 120 },
    edges: { smooth: { type: "continuous" } },
  };
  network = new vis.Network(container, { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) }, options);
  network.on("click", params => {
    if (params.nodes.length) showDetail(params.nodes[0]);
  });
  network.once("stabilizationIterationsDone", () => network.setOptions({ physics: false }));
}

function showDetail(nodeId) {
  const n = DATA.nodes.find(x => x.id === nodeId);
  if (!n) return;
  const docs = n.source_docs.map(d => (DATA.documents.find(x => x.id === d) || {}).name || d);
  const props = Object.entries(n.properties || {}).map(([k, v]) =>
    `<div class="row"><b>${k}:</b> ${v}</div>`).join("");
  document.getElementById("detail").innerHTML =
    `<div class="name">${n.name}</div>`
    + `<span class="lab" style="background:${n.color}">${n.label}</span>`
    + props
    + `<div class="row" style="margin-top:8px"><b>Extracted from:</b></div>`
    + docs.map(d => `<div class="row">• ${d}</div>`).join("");
}

// ---- Documents view -------------------------------------------------------
function renderDocs() {
  document.getElementById("docsView").innerHTML = DATA.documents.map(d =>
    `<div class="doc-card"><span class="dt">${d.doc_type}</span>`
    + `<h4>${d.name}</h4><div class="src">${d.source}</div>`
    + `<pre>${escapeHtml(d.content)}</pre></div>`).join("");
}

// ---- Graph RAG view -------------------------------------------------------
function renderSamples() {
  const qs = [
    "Who is an expert in SentenceTransformers?",
    "What blocks Project Atlas?",
    "Who works on Project Atlas?",
    "What decisions affect Project Atlas?",
    "What technologies does Atlas use?",
  ];
  document.getElementById("samples").innerHTML = qs.map(q =>
    `<span class="chip" data-q="${escapeHtml(q)}">${escapeHtml(q)}</span>`).join("");
  document.querySelectorAll(".samples .chip").forEach(c =>
    c.onclick = () => { document.getElementById("ragQuery").value = c.dataset.q; runRag(); });
}

function tokenize(text) {
  return (text.toLowerCase().match(/[a-z0-9]+/g) || []).filter(t => t.length > 2 && !STOPWORDS.has(t));
}

// Lightweight vector-search stand-in: keyword overlap score over chunks.
function scoreChunks(query) {
  const qTokens = new Set(tokenize(query));
  return DATA.chunks.map(c => {
    const cTokens = tokenize(c.text);
    let hits = 0; cTokens.forEach(t => { if (qTokens.has(t)) hits++; });
    const score = cTokens.length ? hits / Math.sqrt(cTokens.length) : 0;
    return { ...c, score: Number(score.toFixed(4)) };
  }).filter(c => c.score > 0).sort((a, b) => b.score - a.score).slice(0, 3);
}

function expandSubgraph(entryChunks) {
  const seedDocs = new Set(entryChunks.map(c => c.document_id));
  // Seed entities = entities mentioned by the source documents of entry chunks.
  const seedIds = new Set();
  DATA.edges.filter(e => e.relationship === "MENTIONS" && seedDocs.has(e.source_doc))
    .forEach(e => seedIds.add(e.target));
  // 1-2 hop expansion: any typed edge touching a seed entity.
  const triples = DATA.edges.filter(e => e.relationship !== "MENTIONS"
    && (seedIds.has(e.source) || seedIds.has(e.target)));
  const nameOf = id => (DATA.nodes.find(n => n.id === id) || {}).name || id;
  const labelOf = id => (DATA.nodes.find(n => n.id === id) || {}).label || "";
  return {
    seedEntities: [...seedIds].map(id => ({ id, name: nameOf(id), label: labelOf(id) })),
    triples: triples.map(e => ({
      head: nameOf(e.source), head_label: labelOf(e.source),
      relationship: e.relationship,
      tail: nameOf(e.target), tail_label: labelOf(e.target), source_doc: e.source_doc,
    })),
  };
}

function runRag() {
  const query = document.getElementById("ragQuery").value.trim();
  if (!query) return;
  const entryChunks = scoreChunks(query);
  const { seedEntities, triples } = expandSubgraph(entryChunks);

  document.getElementById("ragResult").classList.add("show");

  document.getElementById("ragChunks").innerHTML = entryChunks.length ? entryChunks.map(c =>
    `<div class="chunk"><div class="meta">${c.id} · <span class="score">score ${c.score}</span></div>${escapeHtml(c.text)}</div>`
  ).join("") : `<div class="empty">No matching chunks.</div>`;

  document.getElementById("ragTriples").innerHTML = triples.length ? triples.map(t =>
    `<div class="triple"><span class="h">${t.head}</span><span class="r">${t.relationship}</span><span class="t">${t.tail}</span></div>`
  ).join("") : `<div class="empty">No connected facts found.</div>`;

  const payload = {
    query,
    entry_chunks: entryChunks.map(c => ({ id: c.id, text: c.text, score: c.score, source_doc: c.document_id })),
    seed_entities: seedEntities,
    triples,
    stats: { entry_chunks: entryChunks.length, seed_entities: seedEntities.length, triples: triples.length },
  };
  document.getElementById("ragJson").textContent = JSON.stringify(payload, null, 2);
}

// ---- Tabs + controls ------------------------------------------------------
document.querySelectorAll(".tab").forEach(tab => tab.onclick = () => {
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  tab.classList.add("active");
  document.getElementById(tab.dataset.view).classList.add("active");
  if (tab.dataset.view === "graphView" && network) network.fit();
});
document.getElementById("ragBtn").onclick = runRag;
document.getElementById("ragQuery").addEventListener("keydown", e => { if (e.key === "Enter") runRag(); });
document.getElementById("btnPhysics").onclick = () => { physicsOn = !physicsOn; network.setOptions({ physics: physicsOn }); };
document.getElementById("btnFit").onclick = () => network.fit({ animation: true });
document.getElementById("btnMentions").onclick = () => { mentionsVisible = !mentionsVisible; renderGraph(); };

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

boot();
</script>
</body>
</html>
